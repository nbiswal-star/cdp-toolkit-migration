name: ci
on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e ".[dev,agent]"
      - name: Tests (both ways they are run locally)
        run: |
          python -m pytest -q
          pytest -q
      - name: Offline evaluation
        run: cdp --results eval/results evaluate
      - uses: actions/upload-artifact@v4
        if: matrix.python == '3.12'
        with:
          name: offline-eval
          path: eval/results/offline_eval.*

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: xu-cheng/latex-action@v3
        with:
          working_directory: docs
          root_file: |
            team_contract.tex
            questions.tex
            scope.tex
            techplan.tex
            slides.tex
            consent_request.tex
      - uses: actions/upload-artifact@v4
        with:
          name: documents
          path: docs/*.pdf
